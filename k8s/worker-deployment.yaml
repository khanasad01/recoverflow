apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoverflow-worker
  labels:
    app: recoverflow-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recoverflow-worker
  template:
    metadata:
      labels:
        app: recoverflow-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/recoverflow-worker:latest
          command: ["celery", "-A", "services.worker.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: recoverflow-config
            - secretRef:
                name: recoverflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoverflow-worker-beat
  labels:
    app: recoverflow-worker-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recoverflow-worker-beat
  template:
    metadata:
      labels:
        app: recoverflow-worker-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/your-org/recoverflow-worker:latest
          command: ["celery", "-A", "services.worker.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: recoverflow-config
            - secretRef:
                name: recoverflow-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
