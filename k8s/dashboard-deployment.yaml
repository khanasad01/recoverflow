apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoverflow-dashboard
  labels:
    app: recoverflow-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recoverflow-dashboard
  template:
    metadata:
      labels:
        app: recoverflow-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/your-org/recoverflow-dashboard:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: recoverflow-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: recoverflow-dashboard-service
  labels:
    app: recoverflow-dashboard
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: recoverflow-dashboard
