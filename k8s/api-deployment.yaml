apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoverflow-api
  labels:
    app: recoverflow-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: recoverflow-api
  template:
    metadata:
      labels:
        app: recoverflow-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/recoverflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: recoverflow-config
            - secretRef:
                name: recoverflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recoverflow-api-service
  labels:
    app: recoverflow-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: recoverflow-api
