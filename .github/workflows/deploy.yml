name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'database/**'
      - 'integrations/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 13.222.186.232
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/recoverflow
            git pull origin main
            docker compose up -d --build
